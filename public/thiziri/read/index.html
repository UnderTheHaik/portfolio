><div class="track"><i style="width:${n/d.repeat*100}%"></i></div><button class="primary tap" data-action="count" ${done?'disabled':''}>${done?t('✓ Terminé','✓ اكتمل'):(d.reading?t('Marquer comme lu','تمت القراءة'):t('Compter une récitation','عدّ التكرار'))}</button><div class="reader-actions"><button class="secondary" data-action="previous" ${index===0?'disabled':''}>${t('← Précédent','→ السابق')}</button><button class="secondary" data-action="next">${index===list.length-1?t('Terminer ✓','إنهاء ✓'):t('Suivant →','التالي ←')}</button></div><button class="secondary" data-action="reset">${t('Réinitialiser cette lecture','تصفير عدّاد هذا الذكر')}</button>${cat==='prayer'?`<p class="mini">${t('Pour chaque nouvelle prière, réinitialisez la collection.','صفّر عدّادات المجموعة قبل كل صلاة جديدة.')}</p><button class="secondary" data-action="resetCollection">${t('Commencer une nouvelle prière','ابدأ صلاة جديدة')}</button>`:`<p class="mini">${t('Vos compteurs sont enregistrés sur cet appareil et repartent à zéro chaque jour.','تُحفظ العدّادات على هذا الجهاز وتبدأ من جديد كل يوم.')}</p>`}`;}
 if(view==='settings'){html+=`<div class="eyebrow">${t('À votre rythme','كما تحب')}</div><h1>${t('Un espace à votre goût.','مساحة تريحك.')}</h1><div class="settings-row"><label for="language">${t('Langue de l’interface','لغة الواجهة')}<small>${t('Arabe et français','العربية والفرنسية والإنجليزية')}</small></label><select id="language"><option value="ar" ${state.language==='ar'?'selected':''}>العربية</option><option value="fr" ${state.language==='fr'?'selected':''}>Français</option><option value="en" ${state.language==='en'?'selected':''}>English</option></select></div><div class="settings-row"><label for="dark">${t('Mode sombre','المظهر الداكن')}<small>${t('Un écran plus doux la nuit','شاشة أهدأ ليلًا')}</small></label><input type="checkbox" id="dark" ${state.dark?'checked':''}></div><div class="settings-row"><label for="size">${t('Taille du texte arabe','حجم النص العربي')}</label><select id="size">${[26,30,36,42].map(n=>`<option value="${n}" ${state.size===n?'selected':''}>${({26:t('Petite','صغير'),30:t('Moyenne','متوسط'),36:t('Grande','كبير'),42:t('Très grande','كبير جدًا')})[n]}</option>`).join('')}</select></div><p class="arabic" lang="ar">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</p><h2>${t('À propos de Thiziri','عن ثيزيري')}</h2><p class="meaning">${t('Un espace gratuit et sans publicité pour le dhikr quotidien. Sans compte, publicité, statistiques ni suivi. Les adhkar et votre progression restent sur votre appareil.','مساحة مجانية بلا إعلانات للذكر اليومي. دون حسابات أو إعلانات أو تحليلات أو تتبّع. تبقى الأذكار وتقدّمك على جهازك.')}</p><p class="meaning">${t(dhikr.length+' lectures dans '+categories.length+' collections, accessibles hors ligne. Chaque lecture comporte le texte arabe et son sens dans la langue choisie. Les notes distinguent les textes rapportés, les versets coraniques, les invocations générales et les récits dont l’authenticité reste incertaine. Un compteur personnel n’indique pas un nombre religieusement prescrit.',dhikr.length+' ذكرًا ودعاءً في '+categories.length+' مجموعة، متاحة دون إنترنت. لكل قراءة نص عربي ومعناه باللغة المختارة. تميّز الملاحظات بين النصوص المروية والآيات القرآنية والأدعية العامة والروايات التي لم تثبت صحتها في هذه المراجعة. العدّاد الشخصي لا يعني عددًا مقررًا شرعًا.')}</p><button class="secondary" data-action="clear">${t('Réinitialiser toute la progression','تصفير جميع العدّادات')}</button><p class="mini">${t('Seuls les compteurs sont effacés. Vos favoris et préférences sont conservés.','تُمسح العدّادات فقط. تبقى المحفوظات والتفضيلات كما هي.')}</p><p class="meaning">${t("Les favoris, compteurs et préférences sont enregistrés dans ce navigateur. L’hébergeur reçoit les requêtes nécessaires pour charger le site. Consultez les informations de confidentialité.",'تُحفظ المحفوظات والعدّادات والتفضيلات في هذا المتصفح. يتلقى المستضيف الطلبات اللازمة لتحميل الموقع. راجع معلومات الخصوصية.')}</p><button class="secondary" data-action="deleteAll" style="margin-top:20px">${t('Supprimer toutes les données locales','حذف جميع البيانات المحلية')}</button><p class="mini">${t('Cette action supprime les favoris, compteurs et préférences. Les textes des adhkar restent disponibles.','يحذف هذا الإجراء المحفوظات والعدّادات والتفضيلات. تبقى نصوص الأذكار متاحة.')}</p>`;}
 html+=`<footer class="reader-footer"><a href="/thiziri/privacy/">${rt('الخصوصية','Confidentialité','Privacy')}</a> · Under the Haik</footer>`;app.innerHTML=html;syncWebRoute();renderedReading=view==='reader'?readerList()[index]?.id:null;for(const name of previousDetails){const detail=app.querySelector('details[data-detail="'+name+'"]');if(detail)detail.open=true;}syncNavHeight();

function renderArabic(d){return d.ar.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}
function savedRow(d){return `<button class="saved-row" data-dhikr="${d.id}"><strong class="arabic-title" lang="ar" dir="rtl">${esc(d.title)}</strong><small>${categoryName(categories.find(c=>c.id===d.cats[0]))} · ${repetitionLabel(d)}</small></button>`}
function searchResults(){if(!query.trim())return rows();const q=norm(query),found=dhikr.filter(d=>norm([d.title,d.ar,d.meaning,d.meaningEn,refText(d.references),categoryName(categories.find(c=>c.id===d.cats[0]))].join(' ')).includes(q)),cats=categories.some(c=>norm(c.title+' '+c.fr+' '+c.ar).includes(q));return (cats?rows():'')+(found.length?`<p class="mini">${found.length} ${t('lectures trouvées','نتيجة')}</p>`+found.map(savedRow).join(''):'')||`<p class="empty">${t('Aucune lecture trouvée. Essayez un autre mot.','لم يُعثر على قراءة. جرّب كلمة أخرى.')}</p>`}

function openCat(id){cancelAdvance();readerQueue=null;cat=id;index=0;single=null;view='reader';render();window.scrollTo(0,0)}
function back(){cancelAdvance();readerQueue=null;if(view==='reader'){view=single?returnView:'library';single=null;render();window.scrollTo(0,0);return true}if(view==='collection'){view='library';render();window.scrollTo(0,0);return true}if(view!=='home'){view='home';query='';render();return true}return false}
window.thiziriBack=back;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;refreshDay();if(b.dataset.action!=='count')cancelAdvance();if(b.dataset.view){view=b.dataset.view;query='';single=null;readerQueue=null;render();window.scrollTo(0,0);return}if(b.dataset.cat){openCat(b.dataset.cat);return}if(b.dataset.start||b.dataset.entry!==undefined){index=Number(b.dataset.entry||0);single=null;readerQueue=null;view='reader';render();window.scrollTo(0,0);return}if(b.dataset.dhikr){returnView=view;single=b.dataset.dhikr;cat=dhikr.find(d=>d.id===single).cats[0];readerQueue=(view==='saved'?dhikr.filter(d=>state.favorites.includes(d.id)):dhikr.filter(d=>d.cats.includes(cat))).map(d=>d.id);index=readerQueue.indexOf(single);view='reader';render();window.scrollTo(0,0);return}const a=b.dataset.action;if(a==='theme'){state.dark=!state.dark;save();render();return}if(a==='settings'){view='settings';render();return}if(a==='back'){back();return}if(a==='deleteAll'){if(confirm(t('Supprimer les favoris, compteurs et préférences sur cet appareil ? Cette action est irréversible.','هل تريد حذف المحفوظات والعدّادات والتفضيلات على هذا الجهاز؟ لا يمكن التراجع عن هذا الإجراء.'))){cancelAdvance();clearTimeout(midnightTimer);localStorage.removeItem('thiziri-web');localStorage.removeItem('thiziri-site-language');state=freshState();activeDay=day();query='';single=null;readerQueue=null;index=0;cat='morning';view='home';scheduleMidnight();render();window.scrollTo(0,0)}return}if(a==='clear'){if(confirm(t('Réinitialiser tous les compteurs enregistrés ?','هل تريد تصفير جميع العدّادات المحفوظة؟'))){state.counts={};save();render()}return}if(view!=='reader')return;const list=readerList();const d=list[index];cat=d.cats[0];if(a==='count'){if(autoTimer)return;state.counts[key(d)]=Math.min(d.repeat,count(d)+1);save();const y=window.scrollY;render();window.scrollTo(0,y);if(cat!=='names'&&count(d)>=d.repeat&&index<list.length-1){const finishedId=d.id;autoTimer=setTimeout(()=>{autoTimer=null;if(refreshDay()){render();return}if(view==='reader'&&readerList()[index]?.id===finishedId){index++;render();window.scrollTo(0,0)}},350)}}if(a==='favorite'){state.favorites=state.favorites.includes(d.id)?state.favorites.filter(id=>id!==d.id):[...state.favorites,d.id];save();render()}if(a==='reset'&&confirm(t('Réinitialiser le compteur de ce dhikr ?','هل تريد تصفير عدّاد هذا الذكر؟'))){delete state.counts[key(d)];save();render()}if(a==='resetCollection'&&confirm(t('Réinitialiser les compteurs pour une nouvelle prière ?','هل تريد تصفير العدّادات لصلاة جديدة؟'))){dhikr.filter(d=>d.cats.includes('prayer')).forEach(d=>delete state.counts[key(d)]);index=0;save();render()}if(a==='previous'){index--;render();window.scrollTo(0,0)}if(a==='next'){if(index<list.length-1){index++;render();window.scrollTo(0,0)}else{view=single?returnView:'library';single=null;render();window.scrollTo(0,0)}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('#results').innerHTML=searchResults()}});
document.addEventListener('change',e=>{if(['dark','language','size'].includes(e.target.id)){state[e.target.id]=e.target.id==='size'?Number(e.target.value):e.target.id==='language'?e.target.value:e.target.checked;save();if(e.target.id==='language'){try{localStorage.setItem('thiziri-site-language',state.language)}catch{}}render()}});
function syncWebRoute(){const h=new URLSearchParams();h.set('lang',state.language);if(view==='reader'){h.set('cat',cat);h.set('entry',readerList()[index].id);}else h.set('view',view);history.replaceState(null,'','#'+h.toString());}
function applyWebRoute(){const h=new URLSearchParams(location.hash.slice(1));cancelAdvance();single=null;readerQueue=null;index=0;if(['en','fr','ar'].includes(h.get('lang')))state.language=h.get('lang');if(categories.some(c=>c.id===h.get('cat'))){cat=h.get('cat');view='reader';const selected=readerList().findIndex(d=>d.id===h.get('entry'));if(selected>=0)index=selected;}else if(['home','library','saved','settings'].includes(h.get('view')))view=h.get('view');else view='home';save();render();window.scrollTo(0,0);}
window.addEventListener('hashchange',applyWebRoute);
const deep=new URLSearchParams(location.hash.slice(1));if(['en','fr','ar'].includes(deep.get('lang')))state.language=deep.get('lang');if(categories.some(c=>c.id===deep.get('cat'))){cat=deep.get('cat');view='reader';}else if(['home','library','saved','settings'].includes(deep.get('view')))view=deep.get('view');if(view==='reader'){const selected=readerList().findIndex(d=>d.id===deep.get('entry'));if(selected>=0)index=selected;}
state.counts=Object.fromEntries(Object.entries(state.counts).filter(([k])=>k.startsWith(activeDay+':')));state.progressDate=activeDay;save();
let midnightTimer;function scheduleMidnight(){clearTimeout(midnightTimer);const now=new Date();const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);midnightTimer=setTimeout(()=>{refreshDay();render();scheduleMidnight()},Math.max(1,next-now));}scheduleMidnight();
setInterval(()=>{if(!document.hidden&&refreshDay()){render();scheduleMidnight()}},60000);
window.addEventListener('focus',()=>render());window.addEventListener('pageshow',()=>render());document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();
